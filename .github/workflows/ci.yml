name: CI - Security & Testing Gate

# Robot ini akan berjalan otomatis SETIAP ADA push atau PR ke branch main
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-validation:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil kode terbaru dari repository GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup lingkungan Node.js di server Ubuntu virtual
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm" # Mengaktifkan cache biar proses instalasi dependency cepat

      # 3. Install semua dependencies (termasuk Vitest)
      - name: Install Dependencies
        run: npm ci # Menggunakan 'npm ci' lebih aman & konsisten untuk CI dibanding 'npm install'

      # 4. Jalankan Unit Test Vitest Anda secara otomatis
      - name: Run Vitest Unit Tests
        run: npm run test -- --run
        # 💡 Catatan: '-- --run' memerintahkan Vitest untuk jalan sekali saja (bukan watch mode)
